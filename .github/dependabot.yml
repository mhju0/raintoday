version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    # Disable routine version PRs; security updates remain enabled separately.
    open-pull-requests-limit: 0
    rebase-strategy: auto
    # Compatibility holds rechecked against registry peers on 2026-11-05:
    # typescript-eslint 8.72.1 requires TypeScript >=4.8.4 <6.1.0.
    # eslint-plugin-react 7.37.5 supports ESLint through 9, excluding 10.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      - dependency-name: eslint
        versions:
          - ">=10.0.0"
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    # Disable routine version PRs; security updates remain enabled separately.
    open-pull-requests-limit: 0
    rebase-strategy: auto
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
