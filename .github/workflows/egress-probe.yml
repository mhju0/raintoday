name: egress-probe

# Temporary diagnostic. The 18 KST `local-performance` cohort lost every KMA call
# on 2026-08-25 and 2026-08-26 (0/97 and 0/95 captures) while the 06 KST cohort
# kept succeeding, but the same 18 KST hour had run 97/97 on 2026-08-19..21. That
# leaves two explanations the capture history cannot separate: an hour whose
# egress is unhealthy, or a runner egress address KMA refuses. This probe reads
# both, hourly, without keys, a database, or a single production request.
#
# Delete this workflow once the question is settled — it is not part of the product.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The discriminator. If blackout rounds cluster on particular egress
      # addresses rather than particular hours, moving the cron cannot help.
      - name: Record this runner's egress address
        run: |
          echo "egress_ip=$(curl -sS --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Probe each host
        run: |
          # No `set -e`: a refused host is the measurement, not a reason to stop.
          probe() {
            local label="$1" url="$2" out
            out=$(curl -sS -o /dev/null \
                    --connect-timeout 10 --max-time 25 \
                    -w 'http=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} total=%{time_total}' \
                    "$url" 2>&1) || out="UNREACHABLE ${out}"
            printf '%s  %-22s %s\n' "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" "$label" "$out"
          }

          # Keyless on purpose: these answer 200-with-an-error-body or 4xx without a
          # key, and any HTTP status at all proves the host was reachable. A key
          # would add nothing and would put a secret in a diagnostic.
          probe "data.go.kr/asos"   "https://apis.data.go.kr/1360000/AsosDalyInfoService/getWthrDataList"
          probe "data.go.kr/vilage" "https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0"
          probe "apihub.kma.go.kr"  "https://apihub.kma.go.kr/api/typ01/url/stn_inf.php"
          # Controls. These are the providers that kept working through both
          # blackouts, so a round where they also fail is a sick runner, not KMA.
          probe "open-meteo"        "https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&daily=precipitation_sum&timezone=Asia%2FSeoul"
          probe "pirateweather"     "https://api.pirateweather.net"
          probe "weatherapi"        "https://api.weatherapi.com/v1/forecast.json"
