name: maintenance

on:
  workflow_run:
    workflows: [local-performance, service-health]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow: use only trusted main, never the triggering run's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Track incidents and due reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/maintenance.ts
